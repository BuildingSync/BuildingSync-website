name: CI

on:
  pull_request:
  push:
    branches:
      - "develop"
      - "main"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
        tox_env: [python, precommit]
        exclude:
          - python-version: "3.9"
            tox_env: precommit
    services:
      postgres:
        image: postgres:11.1
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bsync_validator
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display system info
        run: python -c "import sys; print(sys.version)"
      - name: Setup Python
        run: |
          sudo apt-get update
          sudo apt-get install python3-enchant -y
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade tox coveralls
      - name: Run tox
        env:
          DJANGO_SETTINGS_MODULE: bsyncviewer.settings.gh_actions
        run: tox -r -e ${{ matrix.tox_env }}
      - name: Coveralls
        if: ${{ success() && matrix.tox_env == 'python' && matrix.python-version == '3.9' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: coveralls --service=github
